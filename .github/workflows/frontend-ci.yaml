name: Frontend-CI

on:
  push:
    branches:
      - cicd
    paths:
      - frontend/**

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node Setup
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - name: Install Dependencies
        run: |
          cd frontend
          npm install
      
      - name: Snyk Scan
        uses: snyk/actions/node@master
        with:
          command: test
          args: --file=frontend/package.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Sonar Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: ./frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # - name: Build Image
      #   run: docker build -t book-store-frontend:${{ github.sha }} ./frontend

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: book-store-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check Docker Image
        run: docker images

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: book-store-frontend:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Sucess Message
        run: echo "Sucessfully Done"