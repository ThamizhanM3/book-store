name: Frontend-CI

on:
  push:
    branches:
      - cicd
    paths:
      - frontend/**

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node Setup
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - name: Install Dependencies
        run: |
          cd frontend
          npm install
      
      - name: Snyk Scan
        uses: snyk/actions/node@master
        with:
          command: test
          args: --file=frontend/package.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Sonar Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: ./frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      
      - name: Tagging
        id: version_tag
        if: github.ref == 'refs/heads/cicd'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: cicd

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # - name: Build Image
      #   run: docker build -t book-store-frontend:${{ github.sha }} ./frontend

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          # push: true
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/book-store-frontend:${{ steps.version_tag.outputs.new_tag || github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/book-store-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check Docker Image
        run: docker images

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/book-store-frontend:${{ steps.version_tag.outputs.new_tag || github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      
      - name: Docker Push
        if: sucess()
        run: |
          ${{ secrets.DOCKERHUB_USERNAME }}/book-store-frontend:${{ steps.version_tag.outputs.new_tag || github.sha }}
          ${{ secrets.DOCKERHUB_USERNAME }}/book-store-frontend:latest

      - name: Sucess Message
        run: echo "Sucessfully Done"