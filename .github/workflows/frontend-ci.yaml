name: Frontend-CI

on:
  push:
    branches:
      - cicd
    paths:
      - frontend/**

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node Setup
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      - name: Install Dependencies
        run: |
          cd frontend
          npm install
      
      - name: Snyk Scan
        uses: snyk/actions/node@master
        with:
          command: test
          args: --file=frontend/package.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Sonar Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: ./frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      
      - name: Tagging
        id: version_tag
        if: github.ref == 'refs/heads/cicd'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          tag_prefix: frontend-v
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: cicd
          bump_policy: conventional_commits
          default_bump: patch

      - name: Extract Version
        id: extract_version
        run: |
          TAG=${{ steps.version_tag.outputs.new_tag }}
          VERSION=${TAG#frontend-v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Extract Branch Name
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Create Image Tag
        run: |
          IMAGE_TAG=${BRANCH}-${VERSION}
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/book-store-frontend:${{ env.IMAGE_TAG || github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/book-store-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/book-store-frontend:${{ env.IMAGE_TAG || github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      
      - name: Docker Push
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/book-store-frontend:${{ env.IMAGE_TAG || github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/book-store-frontend:latest

      - name: Sucess Message
        run: echo "Sucessfully Done"